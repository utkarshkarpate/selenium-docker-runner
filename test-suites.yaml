# One reusable service. Jenkins sets TEST_SUITE before each docker-compose run.
# ${TEST_SUITE:-placeholder} stops pull/down from warning when no suite is selected.
version: "3"
services:
  test:
    image: uk040193/selenium-docker
    environment:
      - BROWSER
      - HUB_HOST=hub
      - THREAD_COUNT=3
      - TEST_SUITE=${TEST_SUITE:-placeholder}
    volumes:
      - ./output/${TEST_SUITE:-placeholder}:/home/selenium-docker/test-output
